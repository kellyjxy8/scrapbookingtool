<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Collage — Session 1</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Untitled collage</h1>
    <p id="page-size-label">210 × 297 mm</p>
  </header>

  <div class="size-controls">
    <label>Width <input type="number" id="page-width" value="210" min="1" step="1"></label>
    <label>Height <input type="number" id="page-height" value="297" min="1" step="1"></label>
    <select id="page-unit">
      <option value="mm" selected>mm</option>
      <option value="in">in</option>
    </select>
  </div>

  <div class="size-controls">
    <label>Rows <input type="number" id="grid-rows" value="2" min="1" step="1"></label>
    <label>Columns <input type="number" id="grid-cols" value="2" min="1" step="1"></label>
  </div>

  <div class="page" id="page"></div>

  <footer>session 4 — grid size input (rows × columns)</footer>

  <script src="script.js"></script>
</body>
</html>
