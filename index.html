<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Collage — Session 1</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Untitled collage</h1>
    <p id="page-size-label">210 × 297 mm</p>
  </header>

  <div class="size-controls">
    <label>Width <input type="number" id="page-width" value="210" min="1" step="1"></label>
    <label>Height <input type="number" id="page-height" value="297" min="1" step="1"></label>
    <select id="page-unit">
      <option value="mm" selected>mm</option>
      <option value="in">in</option>
    </select>
  </div>

  <div class="page" id="page">
    <div class="column" id="col-left" style="flex-basis: 50%">
      <div class="cell"><span>Cell 1</span></div>
      <div class="cell"><span>Cell 3</span></div>
    </div>
    <div class="divider" id="divider"></div>
    <div class="column" id="col-right" style="flex-basis: 50%">
      <div class="cell"><span>Cell 2</span></div>
      <div class="cell"><span>Cell 4</span></div>
    </div>
  </div>

  <footer>session 3 — user-specified page size</footer>

  <script src="script.js"></script>
</body>
</html>
